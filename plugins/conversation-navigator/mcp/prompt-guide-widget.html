<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TurnCue · 对话导航</title>
    <style>
      :root {
        color-scheme: light;
        --page: #edf2ee;
        --surface: rgba(249, 251, 249, 0.86);
        --surface-strong: rgba(255, 255, 255, 0.72);
        --surface-muted: rgba(243, 247, 244, 0.84);
        --text: #1d211f;
        --muted: #626b66;
        --line: rgba(29, 33, 31, 0.11);
        --line-strong: rgba(20, 126, 88, 0.38);
        --accent: #16875f;
        --accent-hover: #0d704d;
        --accent-soft: rgba(22, 135, 95, 0.1);
        --accent-text: #0d704d;
        --signal-a: #16875f;
        --signal-b: #16875f;
        --signal-c: #16875f;
        --danger: #b23b35;
        --shadow:
          0 1px 0 rgba(255, 255, 255, 0.88) inset,
          0 18px 52px rgba(41, 54, 47, 0.13),
          0 2px 8px rgba(41, 54, 47, 0.06);
        --radius: 22px;
        --row-gap: 8px;
        --row-radius: 16px;
        --row-border: rgba(29, 33, 31, 0.1);
        --row-bg: rgba(255, 255, 255, 0.62);
        --row-shadow: 0 1px 0 rgba(255, 255, 255, 0.76) inset;
        --badge-bg: rgba(255, 255, 255, 0.72);
        --header-bg: rgba(255, 255, 255, 0.28);
        --ring-color: #0f9d6c;
        --ring-highlight: #ffffff;
        --ring-opacity: 0.74;
        --ring-active-opacity: 0.96;
        --ring-blur: 8px;
        --ring-width: 2px;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #111513;
        --surface: rgba(27, 31, 29, 0.92);
        --surface-strong: rgba(35, 41, 38, 0.76);
        --surface-muted: rgba(25, 30, 27, 0.9);
        --text: #f2f5f3;
        --muted: #abb5af;
        --line: rgba(235, 245, 239, 0.11);
        --line-strong: rgba(91, 214, 165, 0.42);
        --accent: #5bd6a5;
        --accent-hover: #79e6ba;
        --accent-soft: rgba(91, 214, 165, 0.12);
        --accent-text: #77dfb5;
        --signal-a: #5bd6a5;
        --signal-b: #5bd6a5;
        --signal-c: #5bd6a5;
        --danger: #ff9b94;
        --shadow:
          0 1px 0 rgba(255, 255, 255, 0.08) inset,
          0 22px 58px rgba(0, 0, 0, 0.38),
          0 2px 10px rgba(0, 0, 0, 0.22);
        --row-gap: 0px;
        --row-radius: 12px;
        --row-border: transparent;
        --row-bg: transparent;
        --row-shadow: none;
        --badge-bg: rgba(255, 255, 255, 0.04);
        --header-bg: rgba(255, 255, 255, 0.015);
        --ring-color: #4ce8aa;
        --ring-highlight: #f0fff8;
        --ring-opacity: 0.88;
        --ring-active-opacity: 1;
        --ring-blur: 12px;
        --ring-width: 2px;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --page: #111513;
          --surface: rgba(27, 31, 29, 0.92);
          --surface-strong: rgba(35, 41, 38, 0.76);
          --surface-muted: rgba(25, 30, 27, 0.9);
          --text: #f2f5f3;
          --muted: #abb5af;
          --line: rgba(235, 245, 239, 0.11);
          --line-strong: rgba(91, 214, 165, 0.42);
          --accent: #5bd6a5;
          --accent-hover: #79e6ba;
          --accent-soft: rgba(91, 214, 165, 0.12);
          --accent-text: #77dfb5;
          --signal-a: #5bd6a5;
          --signal-b: #5bd6a5;
          --signal-c: #5bd6a5;
          --danger: #ff9b94;
          --shadow:
            0 1px 0 rgba(255, 255, 255, 0.08) inset,
            0 22px 58px rgba(0, 0, 0, 0.38),
            0 2px 10px rgba(0, 0, 0, 0.22);
          --row-gap: 0px;
          --row-radius: 12px;
          --row-border: transparent;
          --row-bg: transparent;
          --row-shadow: none;
          --badge-bg: rgba(255, 255, 255, 0.04);
          --header-bg: rgba(255, 255, 255, 0.015);
          --ring-color: #4ce8aa;
          --ring-highlight: #f0fff8;
          --ring-opacity: 0.88;
          --ring-active-opacity: 1;
          --ring-blur: 12px;
          --ring-width: 2px;
        }
      }

      :root[data-accent="blue"] {
        --accent: #0878d9;
        --accent-hover: #0064bd;
        --accent-soft: rgba(0, 122, 255, 0.11);
        --accent-text: #0067c7;
        --signal-a: #0878d9;
        --signal-b: #0878d9;
        --signal-c: #0878d9;
        --ring-color: #2994ff;
      }

      :root[data-accent="orange"] {
        --accent: #c95b12;
        --accent-hover: #aa4808;
        --accent-soft: rgba(231, 101, 18, 0.12);
        --accent-text: #a84100;
        --signal-a: #c95b12;
        --signal-b: #c95b12;
        --signal-c: #c95b12;
        --ring-color: #ff7a1a;
      }

      :root[data-accent="violet"] {
        --accent: #7252d6;
        --accent-hover: #5d3fbd;
        --accent-soft: rgba(114, 82, 214, 0.12);
        --accent-text: #6040bd;
        --signal-a: #7252d6;
        --signal-b: #7252d6;
        --signal-c: #7252d6;
        --ring-color: #9a78ff;
      }

      :root[data-theme="dark"][data-accent="blue"] {
        --accent: #52a8ff;
        --accent-hover: #74b9ff;
        --accent-soft: rgba(82, 168, 255, 0.14);
        --accent-text: #82c1ff;
        --signal-a: #52a8ff;
        --signal-b: #52a8ff;
        --signal-c: #52a8ff;
        --ring-color: #3d9eff;
      }

      :root[data-theme="dark"][data-accent="orange"] {
        --accent: #ff915c;
        --accent-hover: #ffa673;
        --accent-soft: rgba(255, 145, 92, 0.14);
        --accent-text: #ffae7c;
        --signal-a: #ff915c;
        --signal-b: #ff915c;
        --signal-c: #ff915c;
        --ring-color: #ff7a20;
      }

      :root[data-theme="dark"][data-accent="violet"] {
        --accent: #ae91ff;
        --accent-hover: #c0a9ff;
        --accent-soft: rgba(174, 145, 255, 0.14);
        --accent-text: #c7b5ff;
        --signal-a: #ae91ff;
        --signal-b: #ae91ff;
        --signal-c: #ae91ff;
        --ring-color: #9e7bff;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"])[data-accent="blue"] {
          --accent: #52a8ff;
          --accent-hover: #74b9ff;
          --accent-soft: rgba(82, 168, 255, 0.14);
          --accent-text: #82c1ff;
          --signal-a: #52a8ff;
          --signal-b: #52a8ff;
          --signal-c: #52a8ff;
          --ring-color: #3d9eff;
        }

        :root:not([data-theme="light"])[data-accent="orange"] {
          --accent: #ff915c;
          --accent-hover: #ffa673;
          --accent-soft: rgba(255, 145, 92, 0.14);
          --accent-text: #ffae7c;
          --signal-a: #ff915c;
          --signal-b: #ff915c;
          --signal-c: #ff915c;
          --ring-color: #ff7a20;
        }

        :root:not([data-theme="light"])[data-accent="violet"] {
          --accent: #ae91ff;
          --accent-hover: #c0a9ff;
          --accent-soft: rgba(174, 145, 255, 0.14);
          --accent-text: #c7b5ff;
          --signal-a: #ae91ff;
          --signal-b: #ae91ff;
          --signal-c: #ae91ff;
          --ring-color: #9e7bff;
        }
      }

      @property --ring-angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--text);
      }

      body {
        padding: 2px;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          radial-gradient(
            circle at 8% -16%,
            color-mix(in srgb, var(--accent) 16%, transparent),
            transparent 35%
          ),
          radial-gradient(
            circle at 96% 112%,
            color-mix(in srgb, var(--signal-b) 10%, transparent),
            transparent 36%
          ),
          var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px) saturate(1.14);
        -webkit-backdrop-filter: blur(18px) saturate(1.14);
      }

      .shell::before {
        position: absolute;
        z-index: 0;
        inset: 0;
        background-image:
          linear-gradient(
            color-mix(in srgb, var(--accent) 6%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--accent) 6%, transparent) 1px,
            transparent 1px
          );
        background-size: 24px 24px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 76%);
        pointer-events: none;
      }

      .shell::after {
        position: absolute;
        z-index: 0;
        top: 0;
        right: 12%;
        left: 12%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in srgb, var(--accent) 72%, transparent),
          transparent
        );
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 34%, transparent);
        content: "";
        pointer-events: none;
      }

      .header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px 16px 13px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--accent-soft) 64%, transparent),
          transparent 44%
        );
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 3px;
        color: var(--accent-text);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border: 1px solid color-mix(in srgb, var(--accent) 82%, transparent);
        border-radius: 2px;
        background: var(--accent);
        box-shadow:
          0 0 0 3px var(--accent-soft),
          0 0 10px color-mix(in srgb, var(--accent) 46%, transparent);
        transform: rotate(45deg);
        animation: signal-pulse 2.8s ease-in-out infinite;
      }

      @keyframes signal-pulse {
        0%,
        100% {
          opacity: 0.72;
          filter: brightness(0.92);
        }
        50% {
          opacity: 1;
          filter: brightness(1.18);
        }
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.02em;
      }

      .header-meta {
        display: flex;
        align-items: center;
        flex: 0 1 auto;
        gap: 8px;
        min-width: 0;
      }

      .topic {
        max-width: 190px;
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 10px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .interaction-hint {
        flex: 0 0 auto;
        margin: 0;
        padding: 4px 8px;
        border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
        border-radius: 7px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 82%,
          transparent
        );
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9.5px;
        letter-spacing: 0.03em;
        line-height: 1.3;
        white-space: nowrap;
      }

      .suggestions {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 11px;
      }

      .suggestion {
        --signal: var(--signal-a);

        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        min-height: 84px;
        padding: 11px 12px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--signal) 16%, var(--line));
        border-radius: 13px 5px 13px 13px;
        background:
          linear-gradient(
            112deg,
            color-mix(in srgb, var(--signal) 6%, transparent),
            transparent 38%
          ),
          var(--surface-strong);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.03) inset,
          0 7px 20px rgba(2, 10, 20, 0.06);
        cursor: pointer;
        text-align: left;
        touch-action: manipulation;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          box-shadow 150ms ease;
      }

      .suggestion:nth-child(2) {
        --signal: var(--signal-b);
      }

      .suggestion:nth-child(3) {
        --signal: var(--signal-c);
      }

      .suggestion::before {
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 0;
        width: 2px;
        border-radius: 0 2px 2px 0;
        background: var(--signal);
        box-shadow: 0 0 10px color-mix(in srgb, var(--signal) 44%, transparent);
        content: "";
        opacity: 0.52;
        transition: opacity 150ms ease;
      }

      .suggestion::after {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        border-top: 1px solid
          color-mix(in srgb, var(--signal) 52%, transparent);
        border-right: 1px solid
          color-mix(in srgb, var(--signal) 52%, transparent);
        content: "";
        pointer-events: none;
      }

      .suggestion:hover {
        border-color: color-mix(in srgb, var(--signal) 42%, var(--line));
        background: color-mix(
          in srgb,
          var(--surface-strong) 92%,
          var(--signal)
        );
      }

      .suggestion:hover::before {
        opacity: 1;
      }

      .suggestion:focus-visible,
      .secondary:focus-visible,
      .primary:focus-visible,
      textarea:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
        outline-offset: 2px;
      }

      .suggestion[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--signal) 66%, var(--line));
        background: color-mix(
          in srgb,
          var(--surface-strong) 82%,
          var(--signal)
        );
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--signal) 22%, transparent) inset,
          0 0 26px color-mix(in srgb, var(--signal) 11%, transparent);
      }

      .suggestion[aria-pressed="true"]::before {
        opacity: 1;
      }

      .kind-icon {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--signal) 38%, transparent);
        border-radius: 999px;
        background:
          linear-gradient(
            145deg,
            color-mix(in srgb, var(--signal) 20%, transparent),
            color-mix(in srgb, var(--signal) 7%, transparent)
          );
        color: var(--signal);
        box-shadow: 0 0 14px color-mix(in srgb, var(--signal) 7%, transparent);
      }

      .kind-icon svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .suggestion[aria-pressed="true"] .kind-icon {
        background: var(--signal);
        color: #071019;
        box-shadow: 0 0 18px color-mix(in srgb, var(--signal) 28%, transparent);
      }

      .suggestion-copy {
        min-width: 0;
      }

      .suggestion-heading {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }

      .kind-label {
        flex: 0 0 auto;
        order: 2;
        padding: 2px 6px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--signal) 20%, transparent);
        background: color-mix(in srgb, var(--signal) 7%, transparent);
        color: color-mix(in srgb, var(--signal) 72%, var(--text));
        font-size: 10px;
        font-weight: 600;
        line-height: 1.35;
      }

      .suggestion-title {
        display: block;
        min-width: 0;
        overflow: hidden;
        font-size: 14.5px;
        font-weight: 680;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-preview {
        display: -webkit-box;
        margin-top: 3px;
        overflow: hidden;
        color: color-mix(in srgb, var(--muted) 94%, var(--text));
        font-size: 12.5px;
        line-height: 1.5;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .arrow {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--signal) 12%, var(--line));
        border-radius: 8px 3px 8px 8px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 86%,
          transparent
        );
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .suggestion:hover .arrow,
      .suggestion[aria-pressed="true"] .arrow {
        border-color: color-mix(in srgb, var(--signal) 35%, var(--line));
        background: color-mix(in srgb, var(--signal) 10%, transparent);
        color: var(--signal);
      }

      .composer {
        position: relative;
        z-index: 1;
        padding: 12px 14px 14px;
        border-top: 1px solid var(--line);
        background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--accent) 5%, transparent),
            transparent 48%
          ),
          var(--surface-muted);
      }

      .composer[hidden] {
        display: none;
      }

      .composer-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
      }

      .composer-context {
        min-width: 0;
        overflow: hidden;
        color: var(--text);
        font-weight: 620;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .editor {
        width: 100%;
        min-height: 88px;
        max-height: 240px;
        resize: vertical;
        padding: 11px 12px;
        border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line));
        border-radius: 11px 4px 11px 11px;
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--accent) 4%, transparent),
            transparent 45%
          ),
          var(--surface-strong);
        color: var(--text);
        caret-color: var(--accent);
        font-size: 14px;
        line-height: 1.55;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
      }

      .editor::placeholder {
        color: var(--muted);
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }

      .status {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .status[data-tone="error"] {
        color: var(--danger);
      }

      .button-group {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
      }

      .secondary,
      .primary {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 9px 3px 9px 9px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
      }

      .secondary {
        border: 1px solid var(--line);
        background: color-mix(
          in srgb,
          var(--surface-strong) 64%,
          transparent
        );
      }

      .primary {
        border: 1px solid color-mix(in srgb, var(--accent) 86%, white);
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 88%, white),
          var(--accent)
        );
        color: #061016;
        box-shadow:
          0 0 18px color-mix(in srgb, var(--accent) 17%, transparent),
          0 1px 0 rgba(255, 255, 255, 0.28) inset;
      }

      .primary:hover {
        border-color: var(--accent-hover);
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent-hover) 84%, white),
          var(--accent-hover)
        );
      }

      :root[data-theme="light"] .primary {
        color: #ffffff;
      }

      .primary:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .empty {
        grid-column: 1 / -1;
        padding: 20px;
        border: 1px dashed var(--line-strong);
        border-radius: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      /* Adaptive system appearance: B in light mode, C in dark mode. */
      .shell {
        border-color: var(--line);
        background:
          radial-gradient(
            circle at 84% -12%,
            color-mix(in srgb, var(--accent) 10%, transparent),
            transparent 34%
          ),
          var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(1.18);
        -webkit-backdrop-filter: blur(24px) saturate(1.18);
      }

      .shell::before {
        z-index: 4;
        inset: 0;
        padding: var(--ring-width);
        border-radius: inherit;
        background: conic-gradient(
          from var(--ring-angle),
          transparent 0deg 232deg,
          color-mix(in srgb, var(--ring-color) 24%, transparent) 250deg,
          var(--ring-color) 270deg,
          var(--ring-highlight) 286deg,
          var(--ring-color) 302deg,
          color-mix(in srgb, var(--ring-color) 24%, transparent) 320deg,
          transparent 338deg 360deg
        );
        filter:
          drop-shadow(
            0 0 var(--ring-blur)
              color-mix(in srgb, var(--ring-color) 86%, transparent)
          )
          drop-shadow(
            0 0 3px color-mix(in srgb, var(--ring-highlight) 88%, transparent)
          );
        opacity: var(--ring-opacity);
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: ring-orbit 8s linear infinite;
      }

      .shell:has(.suggestion[aria-pressed="true"])::before {
        opacity: var(--ring-active-opacity);
        animation-duration: 5.5s;
      }

      @keyframes ring-orbit {
        to {
          --ring-angle: 360deg;
        }
      }

      .shell::after {
        right: 16%;
        left: 16%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.82),
          transparent
        );
        box-shadow: none;
        opacity: 0.76;
      }

      .header {
        z-index: 5;
        min-height: 56px;
        padding: 6px 8px 6px 14px;
        background: var(--header-bg);
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .eyebrow {
        display: contents;
        margin: 0;
        font-family: inherit;
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0;
        text-transform: none;
      }

      .pulse {
        width: 8px;
        height: 8px;
        border: 0;
        border-radius: 999px;
        box-shadow: 0 0 0 4px var(--accent-soft);
        transform: none;
      }

      h1 {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }

      #mode-label {
        max-width: 132px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topic {
        display: none;
      }

      .interaction-hint {
        display: none;
      }

      .header-meta {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      .preference,
      .appearance {
        position: static;
        flex: 0 0 auto;
      }

      .preference-trigger,
      .appearance-trigger {
        position: relative;
        display: flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        touch-action: manipulation;
      }

      .preference-trigger {
        gap: 6px;
        padding: 0 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 620;
        transition:
          background-color 160ms ease,
          color 160ms ease;
      }

      .preference-trigger::before {
        position: absolute;
        inset: 5px 0;
        z-index: -1;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(
          in srgb,
          var(--surface-strong) 78%,
          transparent
        );
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.3) inset;
        content: "";
      }

      .preference-trigger:hover,
      .preference-trigger[aria-expanded="true"] {
        color: var(--text);
      }

      .preference-trigger:hover::before,
      .preference-trigger[aria-expanded="true"]::before {
        border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
        background: color-mix(
          in srgb,
          var(--surface-strong) 92%,
          var(--accent)
        );
      }

      .preference-icon,
      .preference-chevron,
      .appearance-icon {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      .preference-chevron {
        width: 11px;
        height: 11px;
        transition: transform 180ms ease;
      }

      .preference-trigger[aria-expanded="true"] .preference-chevron {
        transform: rotate(180deg);
      }

      .appearance-trigger {
        width: 44px;
        padding: 0;
        border-radius: 12px;
        transition: color 160ms ease;
      }

      .appearance-trigger::before {
        position: absolute;
        inset: 5px;
        z-index: -1;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(
          in srgb,
          var(--surface-strong) 62%,
          transparent
        );
        content: "";
        transition:
          border-color 160ms ease,
          background-color 160ms ease;
      }

      .appearance-trigger:hover,
      .appearance-trigger[aria-expanded="true"] {
        color: var(--text);
      }

      .appearance-trigger:hover::before,
      .appearance-trigger[aria-expanded="true"]::before {
        border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
        background: color-mix(
          in srgb,
          var(--surface-strong) 90%,
          var(--accent)
        );
      }

      .appearance-icon {
        color: var(--accent-text);
        filter: drop-shadow(
          0 0 5px color-mix(in srgb, var(--ring-color) 32%, transparent)
        );
      }

      .preference-panel,
      .appearance-panel {
        position: absolute;
        z-index: 12;
        top: calc(100% + 7px);
        right: 0;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 96%, var(--page));
        box-shadow:
          0 18px 48px rgba(18, 25, 21, 0.2),
          0 1px 0 rgba(255, 255, 255, 0.5) inset;
        backdrop-filter: blur(28px) saturate(1.2);
        -webkit-backdrop-filter: blur(28px) saturate(1.2);
        animation: appearance-in 180ms ease-out;
      }

      .preference-panel {
        width: min(326px, calc(100vw - 24px));
        padding: 10px;
        border-radius: 18px;
      }

      .appearance-panel {
        width: min(284px, calc(100vw - 28px));
        padding: 10px;
        border-radius: 17px;
      }

      .preference-panel[hidden],
      .appearance-panel[hidden] {
        display: none;
      }

      @keyframes appearance-in {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .panel-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 2px 9px;
      }

      .panel-title {
        margin: 0;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .preference-feedback {
        margin: 0;
        color: var(--accent-text);
        font-size: 10.5px;
        font-weight: 560;
        white-space: nowrap;
      }

      .preference-feedback[data-tone="local"] {
        color: var(--muted);
      }

      .personality-options {
        display: grid;
        gap: 5px;
      }

      .personality-option {
        position: relative;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) 18px;
        min-height: 56px;
        align-items: center;
        gap: 9px;
        padding: 7px 9px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
        touch-action: manipulation;
        transition:
          border-color 160ms ease,
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .personality-option:hover {
        background: color-mix(
          in srgb,
          var(--surface-strong) 84%,
          transparent
        );
        color: var(--text);
      }

      .personality-option:active {
        transform: scale(0.992);
      }

      .personality-option[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
        background: var(--accent-soft);
        color: var(--text);
      }

      .personality-glyph {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line));
        border-radius: 10px;
        background: color-mix(
          in srgb,
          var(--surface-strong) 88%,
          transparent
        );
        color: var(--accent-text);
      }

      .personality-glyph svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.65;
      }

      .personality-copy {
        min-width: 0;
      }

      .personality-name,
      .personality-description {
        display: block;
      }

      .personality-name {
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        line-height: 1.4;
      }

      .personality-description {
        margin-top: 1px;
        font-size: 10.5px;
        line-height: 1.45;
      }

      .personality-check {
        width: 17px;
        height: 17px;
        opacity: 0;
        color: var(--accent-text);
        transition: opacity 160ms ease;
      }

      .personality-option[aria-pressed="true"] .personality-check {
        opacity: 1;
      }

      .count-section,
      .language-section {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        margin-top: 9px;
        padding: 10px 2px 1px;
        border-top: 1px solid var(--line);
      }

      .language-section {
        margin-top: 8px;
      }

      .count-copy {
        min-width: 0;
      }

      .count-label,
      .count-help {
        display: block;
      }

      .count-label {
        color: var(--text);
        font-size: 11.5px;
        font-weight: 620;
      }

      .count-help {
        margin-top: 1px;
        color: var(--muted);
        font-size: 10px;
      }

      .count-options,
      .language-options {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        gap: 3px;
        padding: 3px;
        border-radius: 12px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 88%,
          transparent
        );
      }

      .count-option,
      .language-option {
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        touch-action: manipulation;
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          color 150ms ease;
      }

      .count-option:hover,
      .language-option:hover {
        background: color-mix(
          in srgb,
          var(--surface-strong) 86%,
          transparent
        );
        color: var(--text);
      }

      .count-option[aria-pressed="true"],
      .language-option[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 24%, var(--line));
        background: var(--surface-strong);
        box-shadow: 0 1px 4px rgba(18, 25, 21, 0.08);
        color: var(--accent-text);
      }

      .appearance-section + .appearance-section {
        margin-top: 11px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .appearance-label {
        margin: 0 0 7px 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 560;
      }

      .theme-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 3px;
        border-radius: 12px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 88%,
          transparent
        );
      }

      .theme-option,
      .accent-option {
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          color 150ms ease;
      }

      .theme-option {
        padding: 7px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 560;
      }

      .theme-option:hover,
      .accent-option:hover {
        background: color-mix(
          in srgb,
          var(--surface-strong) 86%,
          transparent
        );
      }

      .theme-option[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
        background: var(--surface-strong);
        box-shadow: 0 1px 4px rgba(18, 25, 21, 0.08);
        color: var(--text);
      }

      .accent-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
      }

      .accent-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 550;
        text-align: left;
      }

      .accent-option[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
        background: var(--accent-soft);
        color: var(--text);
      }

      .accent-swatch {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        border: 2px solid rgba(255, 255, 255, 0.72);
        border-radius: 999px;
        box-shadow: 0 0 0 1px rgba(20, 25, 22, 0.12);
      }

      .accent-swatch[data-color="emerald"] {
        background: #20b47d;
      }

      .accent-swatch[data-color="blue"] {
        background: #2994ff;
      }

      .accent-swatch[data-color="orange"] {
        background: #ff7a1a;
      }

      .accent-swatch[data-color="violet"] {
        background: #9a78ff;
      }

      .appearance-trigger:focus-visible,
      .preference-trigger:focus-visible,
      .personality-option:focus-visible,
      .count-option:focus-visible,
      .language-option:focus-visible,
      .theme-option:focus-visible,
      .accent-option:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
        outline-offset: 2px;
      }

      .suggestions {
        gap: var(--row-gap);
        padding: 10px;
      }

      .suggestion {
        min-height: 92px;
        padding: 13px 13px;
        border: 1px solid var(--row-border);
        border-radius: var(--row-radius);
        background: var(--row-bg);
        box-shadow: var(--row-shadow);
        transition:
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .suggestion::before,
      .suggestion::after {
        display: none;
      }

      .suggestion:hover {
        border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
        background: color-mix(in srgb, var(--row-bg) 92%, var(--accent));
      }

      .suggestion:active {
        transform: scale(0.995);
      }

      .suggestion[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 64%, var(--line));
        background: color-mix(
          in srgb,
          var(--surface-strong) 88%,
          var(--accent)
        );
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent) inset,
          0 10px 28px color-mix(in srgb, var(--accent) 10%, transparent);
      }

      .kind-icon {
        width: 36px;
        height: 36px;
        border-color: color-mix(in srgb, var(--accent) 18%, var(--line));
        border-radius: 999px;
        background: color-mix(
          in srgb,
          var(--accent) 8%,
          var(--surface-strong)
        );
        color: var(--accent-text);
        box-shadow:
          0 1px 2px rgba(31, 38, 34, 0.04),
          0 0 0 1px color-mix(in srgb, var(--accent) 4%, transparent) inset;
      }

      .suggestion[aria-pressed="true"] .kind-icon {
        border-color: color-mix(in srgb, var(--accent) 56%, transparent);
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .suggestion-heading {
        gap: 8px;
      }

      .kind-label {
        order: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--accent-text);
        font-size: 11px;
        font-weight: 550;
      }

      .suggestion-title {
        order: 2;
        font-size: 14px;
        font-weight: 650;
      }

      .suggestion-preview {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .arrow {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 19px;
      }

      .suggestion:hover .arrow,
      .suggestion[aria-pressed="true"] .arrow {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent-text);
      }

      .composer {
        padding: 13px 14px 15px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 90%,
          var(--accent)
        );
      }

      .composer-label {
        margin-bottom: 8px;
        font-family: inherit;
        font-size: 11.5px;
      }

      .editor {
        min-height: 96px;
        padding: 12px 13px;
        border-color: var(--line);
        border-radius: 13px;
        background: color-mix(
          in srgb,
          var(--surface-strong) 92%,
          transparent
        );
        font-size: 14px;
        line-height: 1.6;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.52) inset,
          0 1px 3px rgba(25, 34, 29, 0.05);
      }

      .secondary,
      .primary {
        min-height: 44px;
        border-radius: 11px;
        font-size: 13px;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          opacity 160ms ease;
      }

      .secondary {
        background: color-mix(
          in srgb,
          var(--surface-strong) 84%,
          transparent
        );
      }

      .primary {
        border-color: color-mix(in srgb, var(--accent) 82%, white);
        background: var(--accent);
        color: #ffffff;
        box-shadow:
          0 4px 13px color-mix(in srgb, var(--accent) 18%, transparent),
          0 1px 0 rgba(255, 255, 255, 0.22) inset;
      }

      .primary:hover {
        border-color: var(--accent-hover);
        background: var(--accent-hover);
      }

      :root[data-theme="dark"] .shell {
        background:
          radial-gradient(
            circle at 82% -12%,
            rgba(91, 214, 165, 0.07),
            transparent 32%
          ),
          var(--surface);
      }

      :root[data-theme="dark"] .shell::after {
        opacity: 0.16;
      }

      :root[data-theme="dark"] .suggestions {
        padding: 8px 10px 10px;
      }

      :root[data-theme="dark"] .suggestion {
        min-height: 96px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: var(--row-radius);
        background: transparent;
        box-shadow: none;
      }

      :root[data-theme="dark"] .suggestion:last-child {
        border-bottom-color: transparent;
      }

      :root[data-theme="dark"] .suggestion:hover {
        background: rgba(255, 255, 255, 0.035);
      }

      :root[data-theme="dark"] .suggestion[aria-pressed="true"] {
        border-bottom-color: transparent;
        background: color-mix(in srgb, var(--accent) 13%, transparent);
        box-shadow: 0 0 0 1px
          color-mix(in srgb, var(--accent) 20%, transparent) inset;
      }

      :root[data-theme="dark"] .kind-icon {
        box-shadow: none;
      }

      :root[data-theme="dark"] .editor {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.05) inset,
          0 1px 3px rgba(0, 0, 0, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .shell {
          background:
            radial-gradient(
              circle at 82% -12%,
              rgba(91, 214, 165, 0.07),
              transparent 32%
            ),
            var(--surface);
        }

        :root:not([data-theme="light"]) .shell::after {
          opacity: 0.16;
        }

        :root:not([data-theme="light"]) .suggestions {
          padding: 8px 10px 10px;
        }

        :root:not([data-theme="light"]) .suggestion {
          min-height: 96px;
          border: 0;
          border-bottom: 1px solid var(--line);
          border-radius: var(--row-radius);
          background: transparent;
          box-shadow: none;
        }

        :root:not([data-theme="light"]) .suggestion:last-child {
          border-bottom-color: transparent;
        }

        :root:not([data-theme="light"]) .suggestion:hover {
          background: rgba(255, 255, 255, 0.035);
        }

        :root:not([data-theme="light"]) .suggestion[aria-pressed="true"] {
          border-bottom-color: transparent;
          background: color-mix(in srgb, var(--accent) 13%, transparent);
          box-shadow: 0 0 0 1px
            color-mix(in srgb, var(--accent) 20%, transparent) inset;
        }

        :root:not([data-theme="light"]) .kind-icon {
          box-shadow: none;
        }

        :root:not([data-theme="light"]) .editor {
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.05) inset,
            0 1px 3px rgba(0, 0, 0, 0.18);
        }
      }

      @media (max-width: 560px) {
        .header {
          align-items: center;
          gap: 6px;
          min-height: 54px;
          padding: 5px 6px 5px 11px;
        }

        .topic,
        .interaction-hint {
          display: none;
        }

        .header-title {
          gap: 8px;
        }

        #mode-label {
          display: none;
        }

        .header-meta {
          display: flex;
          margin-left: auto;
        }

        .preference-trigger {
          max-width: 152px;
          padding-inline: 8px;
        }

        .preference-icon {
          display: none;
        }

        .preference-panel,
        .appearance-panel {
          right: 0;
        }

        .preference-panel {
          width: min(326px, calc(100vw - 18px));
