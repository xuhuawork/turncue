        let activeUiLocale = "zh-CN";
        let hostTheme = null;
        let hostLocale = null;
        let hostCapabilities = {};
        let modeTranslationKey = "subtitleInitial";
        let preferenceFeedbackKey = "preferenceNext";
        let statusTranslation = null;
        let preferenceDirty = false;
        let preferenceSyncSequence = 0;
        let latestPreferenceSync = Promise.resolve();

        function openaiApi() {
          try {
            return window.openai;
          } catch {
            return undefined;
          }
        }

        function t(path, values = {}) {
          const parts = path.split(".");
          let value = I18N[activeUiLocale];
          for (const part of parts) value = value && value[part];
          if (typeof value !== "string") return path;
          return value.replace(/\{([^}]+)\}/g, (_, key) =>
            Object.prototype.hasOwnProperty.call(values, key)
              ? String(values[key])
              : `{${key}}`,
          );
        }

        function setStatus(message, tone) {
          statusTranslation = null;
          els.status.textContent = message || "";
          els.status.dataset.tone = tone || "neutral";
        }

        function setStatusKey(key, tone, values) {
          statusTranslation = { key, values: values || {} };
          els.status.textContent = t(key, values);
          els.status.dataset.tone = tone || "neutral";
        }

        function localizedError(key, values) {
          const error = new Error(t(key, values));
          error.translationKey = key;
          error.translationValues = values || {};
          return error;
        }

        function normalizeLocale(locale) {
          const value = String(locale || "").toLowerCase();
          if (value.startsWith("zh")) return "zh-CN";
          if (value.startsWith("en")) return "en-US";
          return null;
        }

        function normalizeLanguage(language) {
          return LANGUAGE_CHOICES.has(language) ? language : "auto";
        }

        function resolveUiLocale() {
          if (languagePreference !== "auto") return languagePreference;
          return (
            normalizeLocale(hostLocale) ||
            normalizeLocale(navigator.language) ||
            normalizeLocale(output && output.locale) ||
            "zh-CN"
          );
        }

        function applyTranslations() {
          activeUiLocale = resolveUiLocale();
          document.documentElement.lang = activeUiLocale;
          document.title = t("documentTitle");
          els.widgetTitle.textContent = "TurnCue";
          els.mode.textContent = t(modeTranslationKey);
          els.preferenceTitle.textContent = t("preferenceTitle");
          els.personalityGroup.setAttribute("aria-label", t("personalityAria"));
          for (const button of els.personalityOptions) {
            const meta = I18N[activeUiLocale].personalities[button.dataset.personality];
            button.querySelector(".personality-name").textContent = meta.label;
            button.querySelector(".personality-description").textContent = meta.description;
          }
          els.countLabel.textContent = t("countLabel");
          els.countHelp.textContent = t("countHelp");
          els.countGroup.setAttribute("aria-label", t("countAria"));
          els.languageLabel.textContent = t("languageLabel");
          els.languageHelp.textContent = t("languageHelp");
          els.languageGroup.setAttribute("aria-label", t("languageAria"));
          for (const button of els.languageOptions) {
            button.textContent = I18N[activeUiLocale].languages[button.dataset.language];
          }
          els.appearanceTrigger.setAttribute("aria-label", t("appearanceOpen"));
          els.appearanceTrigger.title = t("appearanceTitle");
          els.appearancePanel.setAttribute("aria-label", t("appearanceTitle"));
          els.themeLabel.textContent = t("themeLabel");
          els.themeGroup.setAttribute("aria-label", t("themeAria"));
          for (const button of els.themeOptions) {
            button.textContent = I18N[activeUiLocale].themes[button.dataset.themeChoice];
          }
          els.accentLabel.textContent = t("accentLabel");
          els.accentGroup.setAttribute("aria-label", t("accentAria"));
          for (const button of els.accentOptions) {
            const swatch = button.querySelector(".accent-swatch");
            button.replaceChildren(
              swatch,
              document.createTextNode(` ${I18N[activeUiLocale].accents[button.dataset.accentChoice]}`),
            );
          }
          els.suggestions.setAttribute("aria-label", t("suggestionsAria"));
          els.composer.setAttribute("aria-label", t("composerAria"));
          els.draft.placeholder = t("placeholder");
          els.clear.textContent = t("clear");
          els.send.textContent = t(sending ? "sending" : "send");
          if (!selectedId) els.composerContext.textContent = t("composerDefault");
          if (statusTranslation) {
            els.status.textContent = t(statusTranslation.key, statusTranslation.values);
          }
          setPreferenceFeedback(preferenceFeedbackKey, els.preferenceFeedback.dataset.tone);
          updatePreferenceControls();
          renderSuggestions();
        }

        function normalizePersonality(personality) {
          return PERSONALITY_CHOICES.has(personality)
            ? personality
            : "rational";
        }

        function normalizeOptionCount(count) {
          const parsed = Number(count);
          return OPTION_COUNTS.has(parsed) ? parsed : 3;
        }

        function updatePreferenceControls() {
          const meta = I18N[activeUiLocale].personalities[personalityPreference];
          els.preferenceSummary.textContent = `${meta.short} · ${optionCountPreference}`;
          els.preferenceTrigger.setAttribute(
            "aria-label",
            t("preferenceAria", {
              personality: meta.label,
              count: optionCountPreference,
            }),
          );

          for (const button of els.personalityOptions) {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.personality === personalityPreference),
            );
          }
          for (const button of els.countOptions) {
            button.setAttribute(
              "aria-pressed",
              String(
                Number(button.dataset.optionCount) === optionCountPreference,
              ),
            );
          }
          for (const button of els.languageOptions) {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.language === languagePreference),
            );
          }
        }

        function setPreferenceFeedback(key, tone) {
          preferenceFeedbackKey = key || "preferenceNext";
          els.preferenceFeedback.textContent = t(preferenceFeedbackKey);
          els.preferenceFeedback.dataset.tone = tone || "synced";
        }

        function preferenceContextText(snapshot) {
          const meta = I18N[activeUiLocale].personalities[snapshot.personality];
          return t("context", {
            json: JSON.stringify({
              personality: snapshot.personality,
              optionCount: snapshot.optionCount,
              language: snapshot.language,
            }),
            personality: meta.label,
            instruction: meta.instruction,
            count: snapshot.optionCount,
            languageInstruction:
              I18N[activeUiLocale].languageInstructions[snapshot.language],
          });
        }

        function persistNavigationPreference() {
          const api = openaiApi();
          if (!api || typeof api.setWidgetState !== "function") return;
          const current =
            api.widgetState && typeof api.widgetState === "object"
              ? api.widgetState
              : {};
          api.setWidgetState({
            ...current,
            navigationPreference: {
              personality: personalityPreference,
              optionCount: optionCountPreference,
              language: languagePreference,
            },
          });
        }

        async function performPreferenceSync(snapshot, sequence) {
          if (!bridgeReady || !hostCapabilities.updateModelContext) {
            setPreferenceFeedback("preferenceNext", "local");
            return;
          }

          setPreferenceFeedback("preferenceSyncing", "syncing");
          try {
            await rpcRequest(
              "ui/update-model-context",
              {
                content: [
                  {
                    type: "text",
                    text: preferenceContextText(snapshot),
                  },
                ],
              },
              5000,
            );
            if (sequence === preferenceSyncSequence) {
              preferenceDirty = false;
              setPreferenceFeedback("preferenceSynced");
            }
          } catch {
            if (sequence === preferenceSyncSequence) {
              setPreferenceFeedback("preferenceLocal", "local");
            }
          }
        }

        function queuePreferenceSync() {
          preferenceDirty = true;
          const sequence = ++preferenceSyncSequence;
          const snapshot = {
            personality: personalityPreference,
            optionCount: optionCountPreference,
            language: languagePreference,
          };
          latestPreferenceSync = latestPreferenceSync
            .catch(() => undefined)
            .then(() => performPreferenceSync(snapshot, sequence));
          return latestPreferenceSync;
        }

        function setNavigationPreference(personality, optionCount, sync) {
          personalityPreference = normalizePersonality(personality);
          optionCountPreference = normalizeOptionCount(optionCount);
          updatePreferenceControls();
          persistNavigationPreference();
          if (sync) queuePreferenceSync();
        }

        function setLanguagePreference(language, sync) {
          languagePreference = normalizeLanguage(language);
          applyTranslations();
          persistNavigationPreference();
          if (sync) queuePreferenceSync();
        }

        function setTheme(theme) {
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          } else {
            delete document.documentElement.dataset.theme;
          }
        }

        function updateAppearanceControls() {
          for (const button of els.themeOptions) {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.themeChoice === themePreference),
            );
          }
          for (const button of els.accentOptions) {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.accentChoice === accentPreference),
            );
          }
          document.documentElement.dataset.accent = accentPreference;
        }

        function applyThemePreference() {
          setTheme(
            themePreference === "system" ? hostTheme : themePreference,
          );
          updateAppearanceControls();
        }

        function setThemePreference(theme) {
          themePreference = THEME_CHOICES.has(theme) ? theme : "system";
          applyThemePreference();
        }

        function setAccentPreference(accent) {
          accentPreference = ACCENT_CHOICES.has(accent) ? accent : "emerald";
          updateAppearanceControls();
        }

        function setPreferenceOpen(open) {
          const isOpen = Boolean(open);
          els.preferencePanel.hidden = !isOpen;
          els.preferenceTrigger.setAttribute("aria-expanded", String(isOpen));
          if (isOpen) setAppearanceOpen(false);
        }

        function setAppearanceOpen(open) {
          const isOpen = Boolean(open);
          els.appearancePanel.hidden = !isOpen;
          els.appearanceTrigger.setAttribute("aria-expanded", String(isOpen));
          if (isOpen) {
            els.preferencePanel.hidden = true;
            els.preferenceTrigger.setAttribute("aria-expanded", "false");
          }
        }

        function applyHostGlobals(globals) {
          if (!globals || typeof globals !== "object") return;
          if (Object.prototype.hasOwnProperty.call(globals, "theme")) {
            hostTheme =
              globals.theme === "light" || globals.theme === "dark"
                ? globals.theme
                : null;
            if (themePreference === "system") {
              applyThemePreference();
            }
          }
          if (globals.locale) {
            const nextHostLocale = normalizeLocale(globals.locale);
            if (nextHostLocale && nextHostLocale !== hostLocale) {
              hostLocale = nextHostLocale;
              if (languagePreference === "auto") applyTranslations();
            }
          }
        }

        function updateCounter() {
          els.counter.textContent = `${els.draft.value.length} / 300`;
        }

        function isSuggestion(value) {
          return (
            value &&
            typeof value.id === "string" &&
            typeof value.title === "string" &&
            typeof value.prompt === "string" &&
            Object.prototype.hasOwnProperty.call(KIND_META, value.kind)
          );
        }

        function parseOutput(value) {
          if (!value || typeof value !== "object") return null;
          const candidate =
            value.structuredContent &&
            typeof value.structuredContent === "object"
              ? value.structuredContent
              : value;

          if (
            typeof candidate.version !== "string" ||
            !Array.isArray(candidate.suggestions)
          ) {
            return null;
          }

          const suggestions = candidate.suggestions.filter(isSuggestion).slice(0, 5);
          if (suggestions.length < 3) return null;

          const personality = PERSONALITY_CHOICES.has(candidate.personality)
            ? candidate.personality
            : personalityPreference;
          const optionCount = OPTION_COUNTS.has(Number(candidate.optionCount))
            ? Number(candidate.optionCount)
            : suggestions.length;
          const language = LANGUAGE_CHOICES.has(candidate.language)
            ? candidate.language
            : null;

          return {
            version: candidate.version,
            locale:
              typeof candidate.locale === "string" ? candidate.locale : "zh-CN",
            topic:
              typeof candidate.topic === "string" ? candidate.topic : undefined,
            mode: candidate.mode === "update" ? "update" : "activate",
            personality,
            optionCount,
            language,
            suggestions,
          };
        }

        function createKindGlyph(meta) {
          const namespace = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(namespace, "svg");
          const path = document.createElementNS(namespace, "path");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          svg.setAttribute("focusable", "false");
          path.setAttribute("d", meta.iconPath);
          svg.appendChild(path);
          return svg;
        }

        function renderSuggestions() {
          els.suggestions.replaceChildren();

          if (!output) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = t("empty");
            els.suggestions.appendChild(empty);
            return;
          }

          for (const suggestion of output.suggestions) {
            const meta = KIND_META[suggestion.kind];
            const kindLabel = I18N[activeUiLocale].kinds[suggestion.kind];
            const button = document.createElement("button");
            const icon = document.createElement("span");
            const copy = document.createElement("span");
            const heading = document.createElement("span");
            const kind = document.createElement("span");
            const title = document.createElement("span");
            const preview = document.createElement("span");
            const arrow = document.createElement("span");

            button.type = "button";
            button.className = "suggestion";
            button.dataset.id = suggestion.id;
            button.setAttribute("aria-controls", "composer");
            button.setAttribute(
              "aria-expanded",
              String(composerOpen && selectedId === suggestion.id),
            );
            button.setAttribute(
              "aria-pressed",
              String(selectedId === suggestion.id),
            );
            button.setAttribute(
              "aria-label",
              t("suggestionAria", {
                kind: kindLabel,
                title: suggestion.title,
              }),
            );
            button.title = t("suggestionTitle");
            icon.className = "kind-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.appendChild(createKindGlyph(meta));
            copy.className = "suggestion-copy";
            heading.className = "suggestion-heading";
            kind.className = "kind-label";
            kind.textContent = kindLabel;
            title.className = "suggestion-title";
            title.textContent = suggestion.title;
            preview.className = "suggestion-preview";
            preview.textContent = suggestion.prompt;
            arrow.className = "arrow";
            arrow.textContent = "→";
            arrow.setAttribute("aria-hidden", "true");
            heading.append(title, kind);
            copy.append(heading, preview);
            button.append(icon, copy, arrow);
            button.addEventListener("click", () => selectSuggestion(suggestion));
            button.addEventListener("dblclick", (event) => {
              event.preventDefault();
              selectSuggestion(suggestion);
              sendDraft();
            });
            els.suggestions.appendChild(button);
          }
        }

        function setComposerOpen(open) {
          composerOpen = Boolean(open);
          els.composer.hidden = !composerOpen;
        }

        function selectSuggestion(suggestion) {
          selectedId = suggestion.id;
          els.draft.value = suggestion.prompt;
          els.composerContext.textContent = suggestion.title;
          setComposerOpen(true);
          updateCounter();
          renderSuggestions();
          setStatusKey("draftReady");
          els.draft.focus();
          els.draft.setSelectionRange(
            els.draft.value.length,
            els.draft.value.length,
          );
        }

        function applyOutput(value) {
          const parsed = parseOutput(value);
          if (!parsed) return false;

          const sameVersion = output && output.version === parsed.version;
          const isUpdate = output !== null;
          output = parsed;
          setNavigationPreference(
            parsed.personality,
            parsed.optionCount,
            false,
          );
          if (parsed.language) {
            setLanguagePreference(parsed.language, false);
          }
          modeTranslationKey =
            isUpdate || parsed.mode === "update"
              ? "subtitleUpdated"
              : "subtitleActive";

          if (parsed.topic) {
            els.topic.hidden = false;
            els.topic.textContent = parsed.topic;
            els.topic.title = parsed.topic;
          } else {
            els.topic.hidden = true;
            els.topic.textContent = "";
          }

          if (sameVersion) {
            const selectedExists = parsed.suggestions.some(
              (item) => item.id === selectedId,
            );
            if (!selectedExists) {
              selectedId = null;
              els.draft.value = "";
              els.composerContext.textContent = t("composerDefault");
              setComposerOpen(false);
            }
          } else {
            selectedId = null;
            els.draft.value = "";
            els.composerContext.textContent = t("composerDefault");
            setComposerOpen(false);
          }

          updateCounter();
          applyTranslations();
          return true;
        }

        function post(message) {
          if (window.parent === window) {
            throw localizedError("localPreviewError");
          }
          window.parent.postMessage(message, "*");
        }

        function rpcRequest(method, params, timeoutMs = 8000) {
          const id = nextRequestId++;
          return new Promise((resolve, reject) => {
            const timeout = window.setTimeout(() => {
              pending.delete(id);
              reject(localizedError("timeout", { method }));
            }, timeoutMs);
            pending.set(id, { resolve, reject, timeout });

            try {
              post({ jsonrpc: "2.0", id, method, params });
            } catch (error) {
              window.clearTimeout(timeout);
              pending.delete(id);
              reject(error);
            }
          });
        }

        function rpcNotify(method, params) {
          try {
            post({ jsonrpc: "2.0", method, params });
          } catch {
            // Standalone preview has no parent host.
          }
        }

        async function initializeBridge() {
          if (window.parent === window) return;

          try {
            const result = await rpcRequest(
              "ui/initialize",
              {
                appInfo: {
                  name: "TurnCue",
                  version: "1.0.0",
                },
                appCapabilities: {},
                protocolVersion: PROTOCOL_VERSION,
              },
              5000,
            );
            bridgeReady = true;
            hostCapabilities =
              result &&
              result.hostCapabilities &&
              typeof result.hostCapabilities === "object"
                ? result.hostCapabilities
                : {};
            applyHostGlobals(result && result.hostContext);
            rpcNotify("ui/notifications/initialized", {});
            setStatus("");
            startResizeNotifications();
            if (preferenceDirty) queuePreferenceSync();
          } catch {
            hostCapabilities = {};
            if (!openaiApi()) {
              setStatusKey("bridgeUnavailable", "error");
            }
          }
        }

        function startResizeNotifications() {
          if (!bridgeReady || resizeObserver) return;
          let previousHeight = 0;

          resizeObserver = new ResizeObserver(() => {
            const height = Math.ceil(document.documentElement.scrollHeight);
            if (height === previousHeight) return;
            previousHeight = height;
            rpcNotify("ui/notifications/size-changed", {
              width: Math.ceil(document.documentElement.scrollWidth),
              height,
            });
          });
          resizeObserver.observe(document.body);
        }

        async function sendWithBridge(prompt) {
          const result = await rpcRequest("ui/message", {
            role: "user",
            content: [{ type: "text", text: prompt }],
          });

          if (result && result.isError) {
            throw localizedError("bridgeRejected");
          }
        }

        async function sendWithOpenAI(prompt) {
          const api = openaiApi();
          if (!api || typeof api.sendFollowUpMessage !== "function") {
            throw localizedError("sendBridgeUnavailable");
          }
          await api.sendFollowUpMessage({
            prompt,
            scrollToBottom: true,
          });
        }

        async function sendDraft() {
          if (sending) return;
          const prompt = els.draft.value;
          if (!prompt.trim()) {
            setStatusKey("choosePrompt", "error");
            els.draft.focus();
            return;
          }

          sending = true;
          els.send.disabled = true;
          els.send.textContent = t("sending");
          setStatusKey("sendingStatus");

          try {
            await latestPreferenceSync.catch(() => undefined);
            if (bridgeReady) {
              try {
                await sendWithBridge(prompt);
              } catch {
                await sendWithOpenAI(prompt);
              }
            } else {
              await sendWithOpenAI(prompt);
            }

            selectedId = null;
            els.draft.value = "";
            els.composerContext.textContent = t("composerDefault");
            setComposerOpen(false);
            updateCounter();
            renderSuggestions();
            setStatusKey("sent");
          } catch (error) {
            if (error && error.translationKey) {
              setStatusKey(
                error.translationKey,
                "error",
                error.translationValues,
              );
            } else if (error instanceof Error) {
              setStatus(error.message, "error");
            } else {
              setStatusKey("sendFailed", "error");
            }
          } finally {
            sending = false;
            els.send.disabled = false;
            els.send.textContent = t("send");
          }
        }

        function clearDraft() {
          selectedId = null;
          els.draft.value = "";
          els.composerContext.textContent = t("composerDefault");
          setComposerOpen(false);
          updateCounter();
          renderSuggestions();
          setStatus("");
        }

        function handleMessage(event) {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (
            Object.prototype.hasOwnProperty.call(message, "id") &&
            pending.has(message.id)
          ) {
            const request = pending.get(message.id);
            pending.delete(message.id);
            window.clearTimeout(request.timeout);
            if (message.error) {
              request.reject(
                new Error(message.error.message || t("hostRequestFailed")),
              );
            } else {
              request.resolve(message.result);
            }
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            applyOutput(message.params);
          }
          if (message.method === "ui/notifications/host-context-changed") {
            applyHostGlobals(message.params);
          }
        }

        function loadInitialData() {
          const api = openaiApi();
          if (api) {
            applyHostGlobals(api);
            const savedPreference =
              api.widgetState &&
              typeof api.widgetState === "object" &&
              api.widgetState.navigationPreference;
            if (savedPreference && typeof savedPreference === "object") {
              setNavigationPreference(
                savedPreference.personality,
                savedPreference.optionCount,
                false,
              );
              setLanguagePreference(savedPreference.language, false);
            }
            if (applyOutput(api.toolOutput)) return;
          }

          if (window.parent === window) {
            const previewParams = new URLSearchParams(window.location.search);
            setThemePreference(previewParams.get("theme") || "system");
            setAccentPreference(previewParams.get("accent") || "emerald");
            const previewLanguage = normalizeLanguage(
              previewParams.get("lang") || "auto",
            );
            setLanguagePreference(previewLanguage, false);
            const previewLocale = activeUiLocale;
            const previewPersonality = normalizePersonality(
              previewParams.get("personality") || "rational",
            );
            const previewCount = normalizeOptionCount(
              previewParams.get("count") || 3,
            );
            const previewSuggestions = activeUiLocale === "en-US" ? [
              {
                id: "preview-deepen",
                title: "Refine the auto-navigation rules",
                prompt:
                  "Review the current TurnCue Widget, its automatic continuation, tool description, and input schema. Add the context, actions, acceptance criteria, file list, and verification steps needed for reliable multi-turn Agent work.",
                kind: "deepen",
              },
              {
                id: "preview-act",
                title: "Run the next local validation",
                prompt:
                  "Run the current build and tests, then design a three-turn Agent conversation check. Verify that every turn carries forward completed progress, proposes a concrete action, states the expected deliverable, and records failures with a repair path.",
                kind: "act",
              },
              {
                id: "preview-clarify",
                title: "Confirm scope and completion criteria",
                prompt:
                  "Identify the missing information that could still reduce the accuracy of TurnCue suggestions, including target users, available Agent tools, execution permissions, and completion criteria. Ask in priority order and explain what each answer changes.",
                kind: "clarify",
              },
              {
                id: "preview-alternative",
                title: "Compare an alternative path",
                prompt:
                  "Propose one alternative to the current Widget approach. Compare implementation complexity, interaction continuity, and model-call reliability, then state its best use case, key trade-offs, and smallest useful validation.",
                kind: "alternative",
              },
              {
                id: "preview-act-two",
                title: "Create a release checklist",
                prompt:
                  "Turn the current conversation-navigation feature into an executable release checklist covering MCP resource discovery, preference sync, three-to-five suggestions, click-to-edit, double-click send, themes, mobile behavior, and a pass criterion for every item.",
                kind: "act",
              },
            ] : [
              {
                id: "preview-deepen",
                title: "完善自动导航生成规则",
                prompt:
                  "请基于当前对话导航 Widget 的实现，检查自动续回合、工具描述和输入 Schema，补齐适合 Agent 多轮执行的上下文、动作与验收要求，并列出需要修改的文件和验证方法。",
                kind: "deepen",
              },
              {
                id: "preview-act",
                title: "完成下一轮本地验证",
                prompt:
                  "请运行当前项目的构建与测试，并设计一组连续三轮的 Agent 对话验证：每轮检查建议是否承接已完成进度、给出明确动作、说明预期交付物，同时记录失败表现和修复方向。",
                kind: "act",
              },
              {
                id: "preview-clarify",
                title: "确认任务边界和完成标准",
                prompt:
                  "请结合当前实现指出仍会影响下一步建议准确性的关键信息，例如目标用户、Agent 可用工具、自动执行权限和完成标准；按影响优先级提问，并说明每项信息会改变哪部分方案。",
                kind: "clarify",
              },
              {
                id: "preview-alternative",
                title: "比较一条替代推进路线",
                prompt:
                  "请从实现复杂度、交互连贯性和模型调用稳定性三个维度，提出一条与当前 Widget 方案不同的推进路线，说明适用场景、主要取舍和最小验证步骤。",
                kind: "alternative",
              },
              {
                id: "preview-act-two",
                title: "整理可执行的发布清单",
                prompt:
                  "请把当前对话导航功能整理为一份可执行发布清单，覆盖 MCP 资源发现、偏好同步、三到五条建议、单击编辑、双击发送、深浅色与移动端测试，并标出每项通过标准。",
                kind: "act",
              },
            ];
            applyOutput({
              version: "v1-preview",
              locale: previewLocale,
              language: previewLanguage,
              mode: "activate",
              topic: t("previewTopic"),
              personality: previewPersonality,
              optionCount: previewCount,
              suggestions: previewSuggestions.slice(0, previewCount),
            });
            setPreferenceFeedback("preferencePreview", "local");
            setStatusKey("previewStatus");
          }
        }

        window.addEventListener("message", handleMessage);
        window.addEventListener("openai:set_globals", (event) => {
          const detail = event && event.detail;
          applyHostGlobals(detail && (detail.globals || detail));
          const api = openaiApi();
          if (api) applyOutput(api.toolOutput);
        });

        els.draft.addEventListener("input", () => {
          updateCounter();
          if (els.status.dataset.tone === "error") setStatus("");
        });
        els.draft.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            sendDraft();
          }
        });
        els.clear.addEventListener("click", clearDraft);
        els.send.addEventListener("click", sendDraft);
        els.preferenceTrigger.addEventListener("click", () => {
          setPreferenceOpen(els.preferencePanel.hidden);
        });
        for (const button of els.personalityOptions) {
          button.addEventListener("click", () => {
            setNavigationPreference(
              button.dataset.personality,
              optionCountPreference,
              true,
            );
          });
        }
        for (const button of els.countOptions) {
          button.addEventListener("click", () => {
            setNavigationPreference(
              personalityPreference,
              button.dataset.optionCount,
              true,
            );
          });
        }
        for (const button of els.languageOptions) {
          button.addEventListener("click", () => {
            setLanguagePreference(button.dataset.language, true);
          });
        }
        els.appearanceTrigger.addEventListener("click", () => {
          setAppearanceOpen(els.appearancePanel.hidden);
        });
        for (const button of els.themeOptions) {
          button.addEventListener("click", () => {
            setThemePreference(button.dataset.themeChoice);
          });
        }
        for (const button of els.accentOptions) {
          button.addEventListener("click", () => {
            setAccentPreference(button.dataset.accentChoice);
          });
        }
        document.addEventListener("pointerdown", (event) => {
          if (
            !els.preferencePanel.hidden &&
            !els.preference.contains(event.target)
          ) {
            setPreferenceOpen(false);
          }
          if (
            !els.appearancePanel.hidden &&
            !els.appearance.contains(event.target)
          ) {
            setAppearanceOpen(false);
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          if (!els.preferencePanel.hidden) {
            setPreferenceOpen(false);
            els.preferenceTrigger.focus();
          } else if (!els.appearancePanel.hidden) {
            setAppearanceOpen(false);
            els.appearanceTrigger.focus();
          }
        });

        updateAppearanceControls();
        applyTranslations();
        updateCounter();
        loadInitialData();
        initializeBridge();
      })();
    </script>
  </body>
</html>
